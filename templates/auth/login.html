{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="text-left mb-4">
        <h2 class="fw-bold mb-2">Sign In</h2>
        <p class="text-muted">
          Login to start reading and sharing articles.
        </p>
      </div>

      <form method="POST">

        {% csrf_token %}
        {{ form|crispy }}

        <button
          type="submit"
          class="btn btn-warning w-100 fw-semibold mt-4"
        >
          Login
        </button>

      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Don't have an account?
        <a
          href="{% url 'register' %}"
          class="text-dark fw-semibold text-decoration-none"
        >
          Register
        </a>
      </p>

    </div>
  </div>
</div>

{% endblock %}
