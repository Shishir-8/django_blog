{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Django Blog{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      href="{% static 'css/blog.css' %}?v=3.0"
      rel="stylesheet"
    />
  </head>

  <body>

    <!-- Header -->
    <header class="blog-header sticky-top bg-white border-bottom">

      <div class="container">

        <div
          class="d-flex flex-column flex-md-row align-items-center justify-content-between py-3 gap-3"
        >

          <!-- Logo -->
          <div class="w-100 w-md-auto text-center text-md-start">
            <a
              class="blog-header-logo text-dark text-decoration-none fw-bold"
              href="{% url 'home' %}"
            >
              Django Blog
            </a>
          </div>


          <!-- Right Side -->
          <div
            class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2 w-100 w-md-auto"
          >

            <!-- Search -->
            <form
              method="GET"
              action="{% url 'search' %}"
              class="d-flex flex-grow-1"
            >

              <input
                type="search"
                name="keyword"
                value="{{ keywords }}"
                class="form-control"
                placeholder="Search articles..."
                aria-label="Search"
              />

              <button
                type="submit"
                class="btn btn-outline-dark ms-2 flex-shrink-0"
              >
                <i class="bi bi-search"></i>
              </button>

            </form>


            <!-- Login -->
            <a
              href="{% url 'login' %}"
              class="btn btn-warning text-dark fw-semibold px-3 text-nowrap"
            >
              Login
            </a>


            <!-- Register -->
            <a
              href="{% url 'register' %}"
              class="btn btn-outline-secondary fw-medium px-3 text-nowrap"
            >
              Register
            </a>

          </div>

        </div>

      </div>

    </header>


    <!-- Category Scroller -->
    <div class="category-bar border-bottom bg-light">

      <div class="container">

        <nav
          class="nav nav-scroller d-flex justify-content-start gap-3 py-2 overflow-auto flex-nowrap"
        >

          <a
            class="p-2 text-muted text-decoration-none nav-link-custom text-nowrap"
            href="{% url 'home' %}"
          >
            All
          </a>

          {% for cat in categories %}

          <a
            class="p-2 text-muted text-decoration-none nav-link-custom text-nowrap"
            href="{% url 'post_by_category' cat.id %}"
          >
            {{ cat.category_name }}
          </a>

          {% endfor %}

        </nav>

      </div>

    </div>


    <!-- Page Content -->
    {% block content %}

    {% endblock %}


    <!-- Footer -->
    <footer class="blog-footer py-3 mt-5">

      <div class="container text-center">

        <p class="small text-muted mb-0">

          Built with
          <span class="text-danger">❤️</span>
          by

          <a
            href="#"
            class="text-dark fw-bold text-decoration-none border-bottom-hover"
          >
            Shishir Oli
          </a>

        </p>

      </div>

    </footer>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>

  </body>
</html>
