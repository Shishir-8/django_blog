{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <!-- Modern Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- Custom CSS with Cache-Buster Parameter -->
    <link href="{% static 'css/blog.css' %}?v=3.0" rel="stylesheet">
</head>
<body>

    <!-- Sticky Header Navigation -->
    <header class="blog-header sticky-top bg-white border-bottom shadow-sm">
      <div class="container">
        <div class="row flex-nowrap justify-content-between align-items-center py-3">
          <div class="col-6 col-md-4 pt-1">
            <a class="blog-header-logo text-dark text-decoration-none fw-bold" href="/">Django Blog</a>
          </div>
          <div class="col-6 col-md-4 d-flex justify-content-end align-items-center gap-2">
            <a class="btn btn-warning text-white font-weight-semibold shadow-sm px-3" href="#">Login</a>
            <a class="btn btn-outline-secondary font-weight-medium px-3" href="#">Register</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Category Scroller -->
    <div class="category-bar border-bottom mb-4 bg-light">
      <div class="container">
        <nav class="nav nav-scroller d-flex justify-content-start gap-3 py-2 overflow-auto">
          <a class="p-2 text-muted text-decoration-none nav-link-custom" href="{% url 'home' %}">All</a>
          {% for cat in categories %}
          <a class="p-2 text-muted text-decoration-none nav-link-custom" href="{% url 'post_by_category' cat.id %}">{{ cat.category_name }}</a>
          {% endfor %}
        </nav>
      </div>
    </div>


    {% block content %}

    {% endblock %}


<footer class="blog-footer py-3 mt-5">
  <div class="container text-center">
    <p class="small text-muted mb-0">
      Built with <span class="text-danger">❤️</span> by <a href="#" class="text-dark fw-bold text-decoration-none border-bottom-hover">Shishir Oli</a>
    </p>
  </div>
</footer>

</body>
</html>
