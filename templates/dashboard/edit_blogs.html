{% extends 'dashboard/dashboard_base.html' %}
{% load crispy_forms_tags %}


{% block content %}

<div class="p-4">
    <h4 class="fw-bold mb-1">Edit Blogs</h4>
    <form action="{% url 'edit_blogs' blog.id %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="vstack gap-2 mb-2">
            {{ form|crispy }}
        </div>
        <button type="submit" class="btn btn-warning mt-2">Update</button>
    </form>
</div>

{% endblock %}
