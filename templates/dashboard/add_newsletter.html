{% extends 'dashboard/dashboard_base.html' %}

{% block content %}

<div class="p-4">
    <h4 class="fw-bold mb-1">Add Newsletter</h4>

        {% csrf_token %}

        <button type="submit" class="btn btn-warning mt-2">Submit</button>
    </form>
</div>

{% endblock %}
