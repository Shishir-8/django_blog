{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Dashboard | Django Blog{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet" />
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- Sidebar -->
      <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
          <h5 class="mb-0">Django Blog</h5>
        </div>

        <nav class="sidebar-nav">
          <a
            href="{% url 'dashboard' %}"
            class="sidebar-link {% if '/dashboard/' == request.path %}bg-warning{% endif %}"
          >
            <i class="bi bi-grid"></i>
            <span>Dashboard</span>
          </a>

          <a href="{% url 'categories' %}"  class="sidebar-link {% if '/categories/' in request.path %}bg-warning{% endif %}">
            <i class="bi bi-tags"></i>
            <span>Categories</span>
          </a>

          <a
            href="{% url 'blogs' %}"
            class="sidebar-link {% if '/blogs/' in request.path %}bg-warning{% endif %}"
          >
            <i class="bi bi-file-text"></i>
            <span>Blogs</span>
          </a>

          <a class="sidebar-link" href="{% url 'home' %}">
            <i class="bi bi-browser-chrome"></i>
            <span>Visit Website</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <a href="" class="sidebar-link text-danger">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
          </a>
        </div>
      </aside>

      <!-- Main -->
      <div class="dashboard-main flex-grow-1">
        <!-- Header -->
        <header class="dashboard-header">
          <div>
            <h4 class="mb-0">
              Welcome to dashboard, {{ request.user.username }}
            </h4>
          </div>

          <div class="d-flex align-items-center gap-2">
            <div class="user-avatar">
              {{ request.user.username|first|upper }}
            </div>

            <div class="d-none d-sm-block">
              <small class="fw-semibold"> {{ request.user.username }} </small>
            </div>
          </div>
        </header>

        <!-- Content -->
        <main class="dashboard-content">
          {% block content %} {% endblock %}
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
