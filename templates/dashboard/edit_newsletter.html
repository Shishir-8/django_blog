{% extends 'dashboard/dashboard_base.html' %}
{% load crispy_forms_tags %}


{% block content %}

<div class="p-4">
    <h4 class="fw-bold mb-1">Edit Newsletter</h4>
    <form action="{% url 'edit_newsletter' newsletter.id %}" method="POST" style="width: 500px;">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-warning mt-2">Update</button>
    </form>
</div>

{% endblock %}
