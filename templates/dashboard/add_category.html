{% extends 'dashboard/dashboard_base.html' %}
{% load crispy_forms_tags %}


{% block content %}

<div>
    <h4 class="fw-bold mb-1">Add Category</h4>
    <form action="{% url 'add_category' %}" method="POST" style="width: 500px;">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-warning mt-2">Submit</button>
    </form>
</div>

{% endblock %}
